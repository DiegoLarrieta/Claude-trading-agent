# Machine-readable watch levels — the watcher alerts when one prints.
# Human-readable context lives in journal/watch-levels.md; keep both in sync.
# A triggered alert = "re-run the review NOW", never an automatic order.
# Alerts fire at most once per level per day (state in journal/.watch-alerts.json).

levels:
  - ticker: NVDA
    when: at_or_below
    level: 196.00
    note: "core entry zone 194.50-196 reached — fast re-review, planned stop 187.50"
  - ticker: GOOGL
    when: at_or_below
    level: 341.00
    note: "core entry zone 335-341 reached — fast re-review, planned stop ~330"
  - ticker: RKLB
    when: at_or_below
    level: 101.00
    note: "shelf test (50MA + June 9 low) — re-run committee on a REACTION there, never an auto-order"
  - ticker: SNDK
    when: at_or_below
    level: 1895.00
    note: "breakout shelf (June 11 close/high zone) — re-run committee on a HOLD with volume, never an auto-order; chased-at-1986 PASS 06-12"
  - ticker: IDCC
    when: at_or_below
    level: 273.00
    note: "failed-gap tripwire — IDCC setup is DEAD, no re-entry"
