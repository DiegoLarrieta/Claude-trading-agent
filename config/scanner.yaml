# Scanner trigger thresholds — tuned with /backtest evidence over time.
# The scanner is deterministic Python: no LLM reads this file at runtime
# except to explain itself.

poll_interval_seconds: 120
cooldown_minutes: 60            # per-ticker; re-triggers append to existing candidate folder
max_candidates_per_day: 60
max_candidates_per_scan: 8      # the open ALWAYS floods; without a per-scan cap it eats the
                                # whole daily budget in 10 minutes and the scanner goes blind
                                # for the rest of the session (2026-06-11: missed MU +9%,
                                # SNDK +13% mid-afternoon — budget exhausted since 9:50am)

triggers:
  pct_move_intraday: 4.0        # abs % move from previous close
  volume_multiple: 3.0          # vs 20-day average volume
  week52_extreme: true          # new 52-week high/low
  gap_open_pct: 3.0             # gap at the open vs previous close

pre_triage:                     # deterministic kills in scan.py — no folder, no budget, no LLM
  earnings_window_days: 1       # days_to_earnings <= this -> the move IS the earnings reaction
  extraordinary_pct_multiple: 2.0  # ...unless |move| >= this x pct_move_intraday (or watchlist)

queue:                          # candidate inbox protocol (scanner/inbox_queue.py)
  stale_after_minutes: 45       # unprocessed candidate older than this -> stale, journaled, never analyzed
  processing_timeout_minutes: 30  # a 'processing' claim older than this is presumed crashed -> re-offered
  backlog_alert_minutes: 45     # oldest untouched candidate older than this -> watcher alerts
  committee_top_k: 3            # max committees per inbox drain; the rest wait (and may go stale honestly)

universe:
  min_market_cap_usd: 2000000000     # $2B — no microcaps
  min_avg_dollar_volume: 10000000    # $10M/day — must be liquid
  exchanges: [NYSE, NASDAQ]
  exclude_leveraged_etfs: true
