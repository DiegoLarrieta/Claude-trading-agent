# ═══════════════════════════════════════════════════════════════════
# THE LAW — enforced by deterministic code at order time.
# No agent, prompt, or model may override these values.
# Changing this file is a human-only action.
# ═══════════════════════════════════════════════════════════════════

mode: simulation          # simulation | live  (live requires Stage 4: IBKR connected)
kill_switch: false        # true = no orders of any kind, even simulated

# Position sizing — the head trader may propose LESS, never more
trade_size_usd: 200
allow_fractional_shares: true   # IBKR supports fractional US stocks; sizing = trade_size_usd / price
max_trades_per_day: 3
max_open_positions: 5
max_total_exposure_usd: 1400   # ~82% of the $1,700 account — always keep dry powder

# Universe restrictions
ticker_blacklist: []      # tickers the firm may never touch
allow_short_selling: false
allow_options: false

# Execution guards (Stage 4; also respected by the simulator)
order_type: limit         # never market
proposal_ttl_minutes: 10  # confirm window; expired proposals re-trigger analysis
order_ttl_minutes: 60     # placed-order lifetime; unfilled orders cancel
max_price_drift_pct: 1.0  # abort if price moved more than this since proposal

# Authorization (Stage 1+)
telegram_chat_id: 8881191474    # Diego — the ONLY chat the bot obeys or alerts
