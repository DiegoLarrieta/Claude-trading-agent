# ═══════════════════════════════════════════════════════════════════
# THE LAW — enforced by deterministic code at order time.
# No agent, prompt, or model may override these values.
# Changing this file is a human-only action.
# ═══════════════════════════════════════════════════════════════════

mode: paper               # simulation | paper | live   (set to paper 2026-06-11, authorized by Diego)
                          #   simulation: fills are local JSON, broker orders refuse to run
                          #   paper: orders go to the IBKR PAPER account (port-locked in code)
                          #   live: Stage 4 only — not implemented; port lock makes it unreachable
kill_switch: false        # true = no orders of any kind, even simulated

# Position sizing — the head trader may propose LESS, never more
trade_size_usd: 200
allow_fractional_shares: true   # IBKR supports fractional US stocks; sizing = trade_size_usd / price
max_trades_per_day: 3
max_open_positions: 5
max_total_exposure_usd: 1400   # ~82% of the $1,700 account — always keep dry powder

# Universe restrictions
ticker_blacklist: []      # tickers the firm may never touch
allow_short_selling: false
allow_options: false

# Mechanical exit rules — enforced by the monitor, backtestable, no judgment.
# Per-horizon: every position declares its intended holding period at buy
# time and is escalated by that profile. The INITIAL stop is always chosen
# per-stock by the committee; these rules only RAISE it as the trade wins.
# Stops only ever move UP — never widened, never lowered. The law.
# (Approved by Diego 2026-06-10; numbers are starting points for /backtest tuning.)
exits:
  day:        # hours-to-2-days bounce trades: protect gains fast, exit fast
    breakeven_trigger_pct: 4.0
    trail_trigger_pct: 6.0
    trail_distance_pct: 3.0
  swing:      # days-to-weeks (the default; identical to the original single profile)
    breakeven_trigger_pct: 8.0    # up 8% → stop rises to entry (trade can no longer lose)
    trail_trigger_pct: 12.0       # up 12% → stop starts trailing the price
    trail_distance_pct: 6.0       # ...staying 6% below the highest price seen
  core:       # months — conviction holds; normal 10-15% pullbacks must not eject us
    breakeven_trigger_pct: 20.0
    trail_trigger_pct: 30.0
    trail_distance_pct: 15.0

# Execution guards (Stage 4; also respected by the simulator)
order_type: limit         # never market
proposal_ttl_minutes: 10  # confirm window; expired proposals re-trigger analysis
order_ttl_minutes: 60     # placed-order lifetime; unfilled orders cancel
max_price_drift_pct: 1.0  # abort if price moved more than this since proposal

# Authorization (Stage 1+)
telegram_chat_id: 8881191474    # Diego — the ONLY chat the bot obeys or alerts
